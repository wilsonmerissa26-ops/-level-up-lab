name: Apply Formal Mastery Slice I

on:
  push:
    paths:
      - scripts/apply-slice-i.py
      - scripts/trigger-slice-i.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Slice I patch
        run: python3 scripts/apply-slice-i.py
      - name: Syntax checks
        run: |
          node --check app.js
          node --check review-engine.js
          node --check track-a-engine.js
          node --check track-a-diagnostic.js
          node --check track-a-remediation.js
          node --check track-a-verification.js
          node --check track-a-mastery-state.js
          node --check track-a-mastery.js
      - name: Frozen vocabulary and persistence regression
        run: node tests/audit-regression.test.mjs
      - name: Slice D persistence regression
        run: node tests/persistence-slice-d.test.mjs
      - name: Slice E delayed retrieval regression
        run: node tests/review-slice-e.test.mjs
      - name: Slice F Track A engine regression
        run: node tests/track-a-engine.test.mjs
      - name: Slice G diagnostic bank regression
        run: node tests/track-a-diagnostic.test.mjs
      - name: Slice G delivery adapter regression
        run: node tests/track-a-ui-adapter.test.mjs
      - name: Slice H adaptive path modules
        run: node tests/track-a-paths-h.test.mjs
      - name: Slice H adaptive UI
        run: node tests/track-a-adaptive-ui-h.test.mjs
      - name: Slice I mastery generator
        run: node tests/track-a-mastery-i.test.mjs
      - name: Slice I mastery state
        run: node tests/track-a-mastery-state-i.test.mjs
      - name: Slice I mastery UI
        run: node tests/track-a-mastery-ui-i.test.mjs
      - name: Commit generated patch
        run: |
          git config user.name "level-up-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Complete formal Track A mastery loop Slice I"
            git push
          fi

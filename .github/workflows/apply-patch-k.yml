name: Apply Patch K Storage Durability

on:
  push:
    paths:
      - scripts/apply-patch-k.py
      - scripts/trigger-patch-k.txt
      - .github/workflows/apply-patch-k.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Patch K integration
        run: python3 scripts/apply-patch-k.py
      - name: Syntax checks
        run: |
          node --check app.js
          node --check storage-durability.js
          node --check state-integrity.js
          node --check review-engine.js
          node --check track-a-engine.js
          node --check track-a-diagnostic.js
          node --check track-a-remediation.js
          node --check track-a-verification.js
          node --check track-a-mastery-state.js
          node --check track-a-mastery.js
          node --check audit-browser.js
      - name: Existing regression suite
        run: |
          node tests/audit-regression.test.mjs
          node tests/persistence-slice-d.test.mjs
          node tests/review-slice-e.test.mjs
          node tests/track-a-engine.test.mjs
          node tests/track-a-diagnostic.test.mjs
          node tests/track-a-ui-adapter.test.mjs
          node tests/track-a-paths-h.test.mjs
          node tests/track-a-adaptive-ui-h.test.mjs
          node tests/track-a-mastery-i.test.mjs
          node tests/track-a-mastery-state-i.test.mjs
          node tests/track-a-mastery-ui-i.test.mjs
          node tests/release-integrity-j.test.mjs
      - name: Patch K regressions
        run: |
          node tests/storage-durability-k.test.mjs
          node tests/revision-integrity-k.test.mjs
          node tests/patch-k-ui-integration.test.mjs
      - name: Commit generated app integration
        run: |
          git config user.name "level-up-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js
          if git diff --cached --quiet; then
            echo "No generated app changes to commit"
          else
            git commit -m "Implement Patch K storage durability integration"
            git push
          fi

name: Apply Delayed Retrieval Slice E

on:
  push:
    paths:
      - scripts/apply-slice-e.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Slice E patch
        run: python3 scripts/apply-slice-e.py
      - name: Syntax check app and review engine
        run: |
          node --check app.js
          node --check review-engine.js
      - name: Existing audit regression
        run: node tests/audit-regression.test.mjs
      - name: Slice D regression
        run: node tests/persistence-slice-d.test.mjs
      - name: Slice E regression
        run: node tests/review-slice-e.test.mjs
      - name: Commit generated patch
        run: |
          git config user.name "level-up-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js review-engine.js docs/NEXT_SLICES.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Implement fresh delayed retrieval slice E"
            git push
          fi

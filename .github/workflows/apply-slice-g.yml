name: Apply Track A Delivery Slice G

on:
  push:
    paths:
      - scripts/apply-slice-g.py
      - scripts/trigger-slice-g.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Slice G patch
        run: python3 scripts/apply-slice-g.py
      - name: Syntax checks
        run: |
          node --check app.js
          node --check review-engine.js
          node --check track-a-engine.js
          node --check track-a-diagnostic.js
      - name: Existing audit regression
        run: node tests/audit-regression.test.mjs
      - name: Slice D persistence regression
        run: node tests/persistence-slice-d.test.mjs
      - name: Slice E delayed retrieval regression
        run: node tests/review-slice-e.test.mjs
      - name: Slice F Track A engine regression
        run: node tests/track-a-engine.test.mjs
      - name: Track A diagnostic bank regression
        run: node tests/track-a-diagnostic.test.mjs
      - name: Slice G Track A delivery adapter regression
        run: node tests/track-a-ui-adapter.test.mjs
      - name: Commit generated patch
        run: |
          git config user.name "level-up-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Implement Track A controlled diagnostic delivery slice G"
            git push
          fi

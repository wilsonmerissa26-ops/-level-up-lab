name: Apply Release Integrity Patch J

on:
  push:
    paths:
      - scripts/apply-release-integrity-j.py
      - scripts/trigger-release-integrity-j.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply release integrity patch
        run: python3 scripts/apply-release-integrity-j.py
      - name: Syntax checks
        run: |
          node --check app.js
          node --check state-integrity.js
          node --check review-engine.js
          node --check track-a-engine.js
          node --check track-a-diagnostic.js
          node --check track-a-remediation.js
          node --check track-a-verification.js
          node --check track-a-mastery-state.js
          node --check track-a-mastery.js
          node --check audit-browser.js
      - name: Existing regression suite
        run: |
          node tests/audit-regression.test.mjs
          node tests/persistence-slice-d.test.mjs
          node tests/review-slice-e.test.mjs
          node tests/track-a-engine.test.mjs
          node tests/track-a-diagnostic.test.mjs
          node tests/track-a-ui-adapter.test.mjs
          node tests/track-a-paths-h.test.mjs
          node tests/track-a-adaptive-ui-h.test.mjs
          node tests/track-a-mastery-i.test.mjs
          node tests/track-a-mastery-state-i.test.mjs
          node tests/track-a-mastery-ui-i.test.mjs
      - name: Independent audit blocker regressions
        run: node tests/release-integrity-j.test.mjs
      - name: Commit generated patch
        run: |
          git config user.name "level-up-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Fix independent audit release blockers Patch J"
            git push
          fi

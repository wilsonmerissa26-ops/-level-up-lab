name: Level-Up Audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check engines
        run: |
          node --check app.js
          node --check review-engine.js
          node --check track-a-engine.js
          node --check track-a-diagnostic.js
          node --check track-a-remediation.js
          node --check track-a-verification.js
          node --check track-a-mastery-state.js
          node --check track-a-mastery.js
          node --check audit-browser.js
      - name: Run frozen-vocabulary and persistence regression
        run: node tests/audit-regression.test.mjs
      - name: Run Track B persistence slice D regression
        run: node tests/persistence-slice-d.test.mjs
      - name: Run delayed-retrieval slice E regression
        run: node tests/review-slice-e.test.mjs
      - name: Run Track A diagnostic and mastery guard regression
        run: node tests/track-a-engine.test.mjs
      - name: Run Track A deterministic diagnostic bank regression
        run: node tests/track-a-diagnostic.test.mjs
      - name: Run Track A delivery and evidence adapter regression
        run: node tests/track-a-ui-adapter.test.mjs
      - name: Run adaptive Track A path module regression
        run: node tests/track-a-paths-h.test.mjs
      - name: Run adaptive Track A repair and verification UI regression
        run: node tests/track-a-adaptive-ui-h.test.mjs
      - name: Run formal Track A mastery generator regression
        run: node tests/track-a-mastery-i.test.mjs
      - name: Run formal Track A mastery scheduling regression
        run: node tests/track-a-mastery-state-i.test.mjs
      - name: Run formal Track A mastery UI regression
        run: node tests/track-a-mastery-ui-i.test.mjs
